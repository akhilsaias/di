<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to DiPet — Login & Signup</title>
    <meta name="description" content="Access your DiPet account, manage your virtual digital companions, and continue your journey.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F8FAF9;
            --bg-card: #FFFFFF;
            --brand-green: #10B981;
            --brand-green-light: #D1FAE5;
            --brand-green-dark: #047857;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --shadow-subtle: 0 10px 30px -5px rgba(16, 185, 129, 0.08);
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Top Navigation Header */
        header {
            width: 100%;
            background-color: rgba(248, 250, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .logo-icon {
            background: var(--brand-green);
            color: white;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .back-home {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--brand-green);
        }

        /* Main Auth Wrapper */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* Tab Switcher */
        .auth-tabs {
            display: flex;
            background: var(--bg-main);
            padding: 0.3rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 9px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: var(--shadow-card);
        }

        .auth-header {
            text-align: center;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Forms */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-green);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            background-color: var(--brand-green);
            color: white;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--brand-green-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .form-footer-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .form-footer-text a {
            color: var(--brand-green-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .form-footer-text a:hover {
            text-decoration: underline;
        }

        /* Toast Alert */
        .toast-alert {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1E293B;
            color: white;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .toast-alert.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-alert.success { background: #059669; }
        .toast-alert.error { background: #DC2626; }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Hidden helper */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <div class="logo-icon">🐾</div>
                DiPet
            </a>
            <a href="#" class="back-home">← Back to Home</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div id="loginSection">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your account details to access your pets.</p>
                </div>
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="e.g., alex@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Login to DiPet</button>
                </form>
                <div class="form-footer-text">
                    Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Sign Up</a>
                </div>
            </div>

            <div id="signupSection" class="hidden">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Start your virtual companion journey today.</p>
                </div>
                <form class="auth-form" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signupName">Your Name</label>
                        <input type="text" id="signupName" placeholder="e.g., Alex Smith" required>
                    </div>
                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" placeholder="e.g., alex@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Create Password</label>
                        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                    </div>
                    <button type="submit" class="btn-submit">Create Account 🐾</button>
                </form>
                <div class="form-footer-text">
                    Already have an account? <a href="#" onclick="switchTab('login'); return false;">Login</a>
                </div>
            </div>

        </div>
    </div>

    <div class="toast-alert" id="toastAlert">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Action successful!</span>
    </div>

    <footer>
        © 2026 DiPet. Your Pet. Your World. Forever.
    </footer>

    <script>
        function switchTab(tab) {
            const loginSection = document.getElementById('loginSection');
            const signupSection = document.getElementById('signupSection');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginSection.classList.remove('hidden');
                signupSection.classList.add('hidden');
                loginTabBtn.classList.add('active');
                signupTabBtn.classList.remove('active');
            } else {
                loginSection.classList.add('hidden');
                signupSection.classList.remove('hidden');
                loginTabBtn.classList.remove('active');
                signupTabBtn.classList.add('active');
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toastAlert');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = message;
            toast.className = `toast-alert show ${type}`;
            toastIcon.textContent = type === "success" ? "✅" : "⚠️";

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            showToast(`Welcome back, ${email.split('@')[0]}!`, "success");
            setTimeout(() => {
                // simulate redirection to dashboard/pets
                window.location.href = "#";
            }, 1200);
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            showToast(`Account created successfully! Welcome to DiPet, ${name}.`, "success");
            setTimeout(() => {
                // simulate redirection
                switchTab('login');
            }, 1500);
        }
    </script>
</body>
</html>
