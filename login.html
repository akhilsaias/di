<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to DiPet — Your Pet. Your World. Forever.</title>
    <meta name="description" content="Secure login page for DiPet virtual pet platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F8FAF9;
            --bg-card: #FFFFFF;
            --brand-green: #10B981;
            --brand-green-light: #D1FAE5;
            --brand-green-dark: #047857;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --shadow-subtle: 0 10px 30px -5px rgba(16, 185, 129, 0.08);
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Top Header */
        header {
            width: 100%;
            background-color: rgba(248, 250, 249, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .logo-icon {
            background: var(--brand-green);
            color: white;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .back-home {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--brand-green);
        }

        /* Main Login Section */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .login-header {
            text-align: center;
        }

        .login-header h2 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Google Sign-In Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            background: white;
            border: 1px solid var(--border-color);
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
        }

        .google-btn:hover {
            background: #F8FAF9;
            border-color: #94A3B8;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        /* Form Controls */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-green);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-submit {
            background-color: var(--brand-green);
            color: white;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--brand-green-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .form-footer-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .form-footer-text a {
            color: var(--brand-green-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .form-footer-text a:hover {
            text-decoration: underline;
        }

        /* Toast Alert Notification */
        .toast-alert {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1E293B;
            color: white;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .toast-alert.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-alert.success { background: #059669; }
        .toast-alert.error { background: #DC2626; }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🐾</div>
                DiPet
            </a>
            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your digital pet companion.</p>
            </div>

            <button class="google-btn" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.78 2.71v2.25h2.88c1.68-1.55 2.7-3.83 2.7-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.88-2.25c-.81.54-1.85.86-3.08.86-2.34 0-4.32-1.58-5.03-3.71H1.02v2.33C2.55 15.9 5.5 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.95H1.02C.37 6.24 0 7.72 0 9.3s.37 3.06 1.02 4.35l2.95-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.34l2.58-2.58C13.47.89 11.43 0 9 0 5.5 0 2.55 2.1 1.02 4.95l2.95 2.33c.71-2.13 2.69-3.7 5.03-3.7z"/></svg>
                Continue with Google
            </button>

            <div class="divider">or sign in with email</div>

            <form class="login-form" onsubmit="handleEmailLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g., alex@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="form-footer-text">
                Don't have an account? <a href="#">Create Account</a>
            </div>
        </div>
    </div>

    <div class="toast-alert" id="toastAlert">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Successfully logged in!</span>
    </div>

    <footer>
        © 2026 DiPet. Your Pet. Your World. Forever.
    </footer>

    <script>
        function showToast(message, type = "success") {
            const toast = document.getElementById('toastAlert');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = message;
            toast.className = `toast-alert show ${type}`;
            toastIcon.textContent = type === "success" ? "✅" : "⚠️";

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function handleGoogleLogin() {
            showToast("Connecting to Google Account...", "success");
            setTimeout(() => {
                showToast("Successfully signed in with Google!", "success");
                // Redirect back to main dashboard/landing page after login
                setTimeout(() => { window.location.href = "index.html"; }, 1200);
            }, 1000);
        }

        function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            showToast(`Welcome back, ${email.split('@')[0]}!`, "success");
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        }
    </script>
</body>
</html>
